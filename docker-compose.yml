services:
  # Main App Database (PostgreSQL with pg_trgm & FTS)
  db:
    image: postgres:16-alpine
    container_name: zap_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # OpenBiometrics - Official eKYC Face Recognition, Active Liveness, and Document OCR Engine
  openbiometrics:
    build:
      context: ./services/openbiometrics
      dockerfile: Dockerfile
    container_name: openbiometrics_zap
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEVICE=cpu
      - MODULES=face,documents,person
    volumes:
      - ./services/openbiometrics/watchlists:/app/watchlists
      - ./services/openbiometrics/models:/app/models
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/admin/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Main Application
  app:
    build: .
    container_name: zapktor_app
    ports:
      - "8080:8080"
    environment:
      # Ktor's Netty EngineMain only honors the system property form for the
      # port override; passing PORT alone is not picked up by application.conf.
      - JAVA_TOOL_OPTIONS=-Dktor.deployment.port=8080
      - STORAGE_JDBC_URL=jdbc:postgresql://db:5432/postgres
      - STORAGE_USER=postgres
      - STORAGE_PASSWORD=password
      - OPENBIOMETRICS_URL=http://openbiometrics:8000
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbiometrics:
        condition: service_healthy
  #    restart: unless-stopped

  # Redis - High-Speed Real-time Pub/Sub & Presence Broker
  redis:
    image: redis:7-alpine
    container_name: zap_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # pgAdmin - Database Management Tool
  pgAdmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui_zap
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@example.com"
      PGADMIN_DEFAULT_PASSWORD: "password"
    depends_on:
      - db

  # RustFS - Lightweight S3-compatible storage
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs_storage_zap
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console UI
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password
      - RUSTFS_VOLUMES=/data
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    restart: unless-stopped

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
  redis_data: