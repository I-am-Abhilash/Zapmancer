<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zapmancer - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #EFF8F7;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .btn-bounce:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 210, 63, 0.3);
        }
        .btn-bounce:active {
            transform: translateY(0);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#2BA8A2",
                        "secondary": "#FFD23F",
                        "background": "#EFF8F7",
                        "surface": "#FFFFFF",
                        "cream": "#FFF8E7",
                        "outline": "#D1DBDA",
                        "on-surface": "#1A1C1C",
                        "on-surface-variant": "#404948"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "9999px",
                        "md": "0.5rem"
                    },
                    "spacing": {
                        "xl": "32px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xs": "4px",
                        "gutter": "16px",
                        "base": "4px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "body-md": ["Plus Jakarta Sans"],
                        "mono": ["jetbrainsMono"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "h2": ["Plus Jakarta Sans"],
                        "h3": ["Plus Jakarta Sans"],
                        "h1": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "mono": ["13px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "display": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "h2": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "h3": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "h1": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "700"}],
                        "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="flex min-h-screen items-center justify-center p-md">
<!-- Primary Canvas -->
<main class="w-full max-w-[400px] flex flex-col gap-xl">
<!-- Brand Identifier -->
<div class="flex flex-col items-center gap-sm">
<div class="w-12 h-12 bg-[#2BA8A2] flex items-center justify-center rounded-md shadow-sm">
<span class="material-symbols-outlined text-white text-[28px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface tracking-tight">Zapmancer</h1>
<p class="font-body-md text-on-surface-variant">Sign in to your dashboard</p>
</div>
<!-- Login Form Container (Card) -->
<div class="bg-surface border border-outline p-xl rounded-md shadow-sm">
<form action="#" class="flex flex-col gap-lg" method="POST" onsubmit="return false;">
<!-- Email Input Group -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-xs" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">mail</span>
<input class="w-full bg-[#FFF8E7] border border-outline rounded-md py-md pl-[44px] pr-md text-on-surface font-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input Group -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline font-semibold" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">lock</span>
<input class="w-full bg-[#FFF8E7] border border-outline rounded-md py-md pl-[44px] pr-md text-on-surface font-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Sign In Button (Primary CTA Gold Pill) -->
<button class="w-full bg-[#FFD23F] text-on-surface font-h3 text-h3 py-md rounded-full transition-all duration-200 flex items-center justify-center gap-sm btn-bounce border-b-4 border-yellow-600/20" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-outline"></span>
</div>
<div class="relative flex justify-center text-label-md">
<span class="bg-surface px-sm text-on-surface-variant uppercase tracking-widest text-[10px] font-bold">or</span>
</div>
</div>
<!-- Secondary Actions -->
<div class="flex flex-col gap-sm">
<button class="w-full bg-transparent border border-outline hover:bg-background text-on-surface font-body-md py-md rounded-md transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[20px]">key</span>
                    Continue with SSO
                </button>
</div>
</div>
<!-- Footer Links -->
<p class="text-center font-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="text-primary font-h3 hover:underline" href="#">Join</a>
</p>
<!-- System Status Indicator -->
<div class="mt-xl flex items-center justify-center gap-sm opacity-60">
<div class="w-2 h-2 bg-primary rounded-full animate-pulse"></div>
<span class="font-label-md text-label-md text-on-surface-variant">All systems operational</span>
</div>
</main>
<script>
        // Micro-interaction for input focus effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-primary');
            });
        });

        // Simple button active state feedback
        const btn = document.querySelector('button[type="submit"]');
        btn.addEventListener('click', function() {
            const originalContent = this.innerHTML;
            this.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span>`;
            setTimeout(() => {
                this.innerHTML = originalContent;
            }, 1500);
        });
    </script>
</body></html>
